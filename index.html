<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance Scanner</title>
<meta name="description" content="Scan attendance sheets and get present student lists instantly">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Attendance">
<style>
  html, body { 
    margin: 0; 
    padding: 0; 
    background: #0f172a; 
    min-height: 100vh; 
    color: #f8fafc;
  }
</style>
</head>
<body>
<div id="app-root"></div>
<style>
  #app-root, #app-root * { box-sizing: border-box; }
  #app-root {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 48px;
    background: transparent;
  }
  
  .as-header { 
    text-align: center; 
    margin-bottom: 28px; 
  }
  .as-header h1 { 
    font-size: 24px; 
    font-weight: 800; 
    margin: 0 0 6px; 
    color: #ffffff; 
    letter-spacing: -0.02em;
  }
  .as-header p { 
    font-size: 14px; 
    color: #94a3b8; 
    margin: 0; 
  }

  .as-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
  }

  .as-drop {
    border: 2px dashed #475569;
    border-radius: 16px;
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    transition: all .2s ease;
    background: #0f172a;
  }
  .as-drop:hover, .as-drop.drag { 
    border-color: #6366f1; 
    background: #1e1b4b50; 
  }
  .as-drop svg { margin-bottom: 10px; opacity: .8; color: #818cf8; }
  .as-drop .as-main-txt { font-size: 15px; font-weight: 600; color: #f1f5f9; }
  .as-drop .as-sub-txt { font-size: 13px; color: #94a3b8; margin-top: 4px; }

  .as-preview-wrap { position: relative; border-radius: 14px; overflow: hidden; margin-bottom: 16px; border: 1px solid #334155; }
  .as-preview-wrap img { width: 100%; display: block; max-height: 360px; object-fit: contain; background: #0f172a; }
  .as-preview-clear {
    position: absolute; top: 10px; right: 10px;
    background: rgba(15, 23, 42, 0.8); color: #fff; border: 1px solid #475569; border-radius: 10px;
    width: 34px; height: 34px; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  .as-preview-clear:hover { background: rgba(239, 68, 68, 0.8); border-color: #ef4444; }

  .as-field { margin-bottom: 16px; }
  .as-field label { font-size: 13px; font-weight: 600; color: #cbd5e1; display: block; margin-bottom: 6px; }
  .as-field input[type=number] {
    width: 100%; padding: 11px 14px; border: 1px solid #475569; border-radius: 12px; font-size: 15px;
    background: #0f172a; color: #fff; outline: none; transition: border-color .2s;
  }
  .as-field input[type=number]:focus { border-color: #6366f1; }

  .as-btn {
    width: 100%; padding: 13px 16px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    transition: all .2s ease;
  }
  .as-btn:hover { opacity: 0.95; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4); }
  .as-btn:active { transform: translateY(0); }
  .as-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
  
  .as-btn.secondary { 
    background: #334155; 
    color: #f1f5f9; 
    box-shadow: none; 
  }
  .as-btn.secondary:hover { background: #475569; box-shadow: none; }

  .as-spinner {
    width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.3);
    border-top-color: #fff; border-radius: 50%; animation: as-spin .7s linear infinite;
  }
  @keyframes as-spin { to { transform: rotate(360deg); } }

  .as-error {
    background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;
    padding: 12px 14px; border-radius: 12px; font-size: 13.5px; margin-bottom: 14px;
  }

  .as-summary { display: flex; gap: 12px; margin-bottom: 16px; }
  .as-summary .box { flex: 1; border-radius: 14px; padding: 14px; text-align: center; border: 1px solid transparent; }
  .as-summary .box.present { background: rgba(34, 197, 94, 0.1); border-color: rgba(34, 197, 94, 0.2); }
  .as-summary .box.absent { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); }
  .as-summary .box .n { font-size: 24px; font-weight: 800; }
  .as-summary .box.present .n { color: #4ade80; }
  .as-summary .box.absent .n { color: #f87171; }
  .as-summary .box .l { font-size: 12px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }

  .as-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
    gap: 8px; margin-bottom: 16px; max-height: 280px; overflow-y: auto; padding: 4px;
  }
  .as-grid::-webkit-scrollbar { width: 6px; }
  .as-grid::-webkit-scrollbar-track { background: #0f172a; border-radius: 4px; }
  .as-grid::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

  .as-num {
    aspect-ratio: 1; border-radius: 10px; border: 1px solid #334155;
    background: #0f172a; color: #94a3b8; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    user-select: none; transition: all .15s ease;
  }
  .as-num:hover { border-color: #6366f1; color: #fff; }
  .as-num.present { background: #22c55e; border-color: #22c55e; color: #ffffff; font-weight: 700; box-shadow: 0 2px 8px rgba(34, 197, 94, 0.3); }
  .as-num:active { transform: scale(0.9); }

  .as-hint { font-size: 13px; color: #94a3b8; margin-bottom: 16px; line-height: 1.5; }

  .as-output {
    background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 14px; font-size: 13.5px;
    line-height: 1.6; word-break: break-word; color: #e2e8f0; margin-bottom: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  .as-actions { display: flex; gap: 12px; }
  .as-actions .as-btn { flex: 1; }
</style>

<script>
(function(){
  const root = document.getElementById('app-root');

  const state = {
    imageBase64: null,
    imageMediaType: null,
    imageDataUrl: null,
    total: 180,
    presentSet: new Set(),
    scanned: false,
    loading: false,
    error: null
  };

  function render(){
    root.innerHTML = `
      <div class="as-header">
        <h1>📋 Attendance Sheet Scanner</h1>
        <p>Sheet ki photo upload karein — sirf present (circled) roll numbers alag list mein mil jayenge</p>
      </div>

      <div class="as-card">
        ${state.imageDataUrl ? `
          <div class="as-preview-wrap">
            <img src="${state.imageDataUrl}" />
            <button class="as-preview-clear" id="as-clear" title="Remove image">✕</button>
          </div>
        ` : `
          <div class="as-drop" id="as-drop">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 16.5V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2.5M16 8l-4-4-4 4M12 4v13"/></svg>
            <div class="as-main-txt">Attendance sheet ki photo yahan daalein</div>
            <div class="as-sub-txt">Tap karke camera ya gallery se select karein</div>
          </div>
          <input type="file" id="as-file" accept="image/*" capture="environment" style="display:none" />
        `}

        ${!state.scanned ? `
          <div class="as-field" style="margin-top:16px;">
            <label>Total students is class mein (roll number range)</label>
            <input type="number" id="as-total" value="${state.total}" min="1" max="500" />
          </div>
          <button class="as-btn" id="as-scan" ${(!state.imageDataUrl \vert{}\vert{} state.loading) ? 'disabled' : ''}>${state.loading ? '<div class="as-spinner"></div> Sheet scan ho rahi hai...' : '🔍 Scan Attendance'}
          </button>
        ` : ''}

        ${state.error ? `<div class="as-error" style="margin-top:14px;">${state.error}</div>` : ''}
      </div>

      ${state.scanned ? renderResults() : ''}
    `;
    attachEvents();
  }

  function renderResults(){
    const presentList = [...state.presentSet].sort((a,b)=>a-b);
    const absentCount = state.total - presentList.length;
    let gridHtml = '';
    for (let i = 1; i <= state.total; i++){
      gridHtml += `<div class="as-num ${state.presentSet.has(i) ? 'present':''}" data-n="${i}">${i}</div>`;
    }
    return `
      <div class="as-card">
        <div class="as-summary">
          <div class="box present"><div class="n">${presentList.length}</div><div class="l">Present</div></div>
          <div class="box absent"><div class="n">${absentCount}</div><div class="l">Absent</div></div>
        </div>

        <div class="as-hint">✨ AI ne yeh circled numbers detect kiye hain. Agar koi galat ho to neeche tap karke theek kar sakte hain (green = present).</div>
        <div class="as-grid" id="as-grid">${gridHtml}</div>

        <div class="as-field" style="margin-top: 16px;">
          <label>Present roll numbers (comma separated)</label>
          <div class="as-output" id="as-output">${presentList.join(', ') || '—'}</div>
        </div>

        <div class="as-actions">
          <button class="as-btn secondary" id="as-copy">📋 Copy List</button>
          <button class="as-btn secondary" id="as-download">⬇️ Download CSV</button>
        </div>
        <button class="as-btn" id="as-rescan" style="margin-top:12px; background:#334155; color:#f1f5f9; box-shadow:none;">🔄 Nayi Sheet Scan Karein</button>
      </div>
    `;
  }

  function attachEvents(){
    const drop = document.getElementById('as-drop');
    const fileInput = document.getElementById('as-file');
    if (drop && fileInput){
      drop.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', handleFile);
      ['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
      ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
      drop.addEventListener('drop', e => {
        if (e.dataTransfer.files && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
      });
    }
    const clearBtn = document.getElementById('as-clear');
    if (clearBtn) clearBtn.addEventListener('click', () => {
      state.imageDataUrl = null; state.imageBase64 = null; state.scanned = false; state.error = null;
      render();
    });
    const totalInput = document.getElementById('as-total');
    if (totalInput) totalInput.addEventListener('input', e => { state.total = parseInt(e.target.value)||180; });

    const scanBtn = document.getElementById('as-scan');
    if (scanBtn) scanBtn.addEventListener('click', scanSheet);

    const rescanBtn = document.getElementById('as-rescan');
    if (rescanBtn) rescanBtn.addEventListener('click', () => {
      state.imageDataUrl = null; state.imageBase64 = null; state.scanned = false; state.error = null; state.presentSet = new Set();
      render();
    });

    const grid = document.getElementById('as-grid');
    if (grid) grid.addEventListener('click', e => {
      const cell = e.target.closest('.as-num');
      if (!cell) return;
      const n = parseInt(cell.dataset.n);
      if (state.presentSet.has(n)) state.presentSet.delete(n); else state.presentSet.add(n);
      render();
    });

    const copyBtn = document.getElementById('as-copy');
    if (copyBtn) copyBtn.addEventListener('click', () => {
      const list = [...state.presentSet].sort((a,b)=>a-b).join(', ');
      navigator.clipboard.writeText(list).then(() => {
        copyBtn.textContent = '✅ Copied!';
        setTimeout(() => { copyBtn.textContent = '📋 Copy List'; }, 1500);
      });
    });

    const dlBtn = document.getElementById('as-download');
    if (dlBtn) dlBtn.addEventListener('click', () => {
      const list = [...state.presentSet].sort((a,b)=>a-b);
      let csv = 'Roll Number,Status\n';
      for (let i = 1; i <= state.total; i++){
        csv += `${i},${state.presentSet.has(i) ? 'Present':'Absent'}\n`;
      }
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'attendance.csv'; a.click();
      URL.revokeObjectURL(url);
    });
  }

  function handleFile(e){
    if (e.target.files && e.target.files[0]) loadFile(e.target.files[0]);
  }

  function loadFile(file){
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = () => {
      state.imageDataUrl = reader.result;
      state.imageMediaType = file.type;
      state.imageBase64 = reader.result.split(',')[1];
      state.error = null;
      render();
    };
    reader.readAsDataURL(file);
  }

  async function scanSheet(){
    state.loading = true; state.error = null; render();
    try {
      const response = await fetch("/api/scan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          image: state.imageBase64,
          mediaType: state.imageMediaType,
          total: state.total
        })
      });
      const parsed = await response.json();
      if (parsed.error) throw new Error(parsed.error);
      const present = Array.isArray(parsed.present) ? parsed.present.filter(n => Number.isInteger(n) && n >= 1 && n <= state.total) : [];
      state.presentSet = new Set(present);
      state.scanned = true;
    } catch (err) {
      state.error = 'Scan mein masla hua: ' + (err.message || 'unknown error') + '. Dobara try karein ya clear photo lein.';
    } finally {
      state.loading = false;
      render();
    }
  }

  render();
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
